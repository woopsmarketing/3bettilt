packages:
  - 'apps/*'
  - 'packages/*'
  - 'solver-lab'

# Native/build-script dependencies we have explicitly reviewed and allow to run
# install scripts. Add nothing here without checking what the script does.
allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@testing-library/react@16.3.3'
  - happy-dom@20.11.12
